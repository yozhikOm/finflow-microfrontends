name: Release Please

on:
  push:
    branches: [master]

# Права на запись нужны только этому workflow: создать release-PR,
# повесить на него метки и после мержа создать тег и GitHub Release.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Версии и пакеты описаны в release-please-config.json,
      # текущие версии хранятся в .release-please-manifest.json.
      # PR, открытые от GITHUB_TOKEN, не запускают другие workflow, и release PR
      # остался бы без обязательных проверок в master. Поэтому PR открываются
      # от токена из секрета; пока его нет, работает GITHUB_TOKEN.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
